[package]
name = "mlbb_items"
version = "1.5.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# The stable SDK is bundled as source beside this crate. The native six-slot
# hooks also require the pinned Windows toolchain and legacy SDK in docs/BUILD.md.
[dependencies]
mod-api-stable = { path = "../mod-api-stable" }
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# build.rs compiles text/item_classes.json into item_catalog.rs's CATEGORY_OF.
[build-dependencies]
serde_json = "1"

[workspace]
